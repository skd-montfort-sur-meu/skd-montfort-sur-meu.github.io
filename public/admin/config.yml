backend:
  name: github
  repo: skd-montfort-sur-meu/skd-montfort-sur-meu.github.io
  branch: main
  base_url: https://skd-montfort-oauth.lc-fremont.workers.dev
  auth_endpoint: /auth

local_backend: true

locale: "fr"

media_folder: "public/images/gallery"
public_folder: "/images/gallery"

collections:
  - name: "club"
    label: "Club"
    description: "Informations et données de présentation du club."
    files:
      - name: "informations"
        label: "Informations générales"
        file: "src/content/config/club.json"
        format: "json"
        fields:
          - { label: "Nom", name: "name", widget: "string" }
          - { label: "Nom complet", name: "fullName", widget: "string" }
          - { label: "Adresse du dojo", name: "address", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Téléphone 1", name: "phone", widget: "string" }
          - { label: "Téléphone 2", name: "phone2", widget: "string" }
          - { label: "Facebook", name: "facebook", widget: "string" }
          - { label: "Instagram", name: "instagram", widget: "string" }
          - { label: "Président(e)", name: "president", widget: "string" }
          - { label: "Trésorier(ère)", name: "treasurer", widget: "string" }
          - { label: "Secrétaire", name: "secretary", widget: "string" }
          - { label: "Description (pied de page)", name: "footerDescription", widget: "text" }

      - name: "presentation"
        label: "Présentation"
        file: "src/content/config/club-about.json"
        format: "json"
        fields:
          - label: "Présentation (page d'accueil)"
            name: "about"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Titre — début", name: "titlePrefix", widget: "string" }
              - { label: "Titre — surligné", name: "titleHighlight", widget: "string" }
              - label: "Contenu"
                name: "body"
                widget: "richtext"
                hint: "Séparez vos paragraphes par une ligne vide."
              - label: "Citation"
                name: "quote"
                widget: "richtext"

          - label: "Points forts (cartes)"
            name: "features"
            widget: "list"
            summary: "{{fields.title}} — {{fields.desc}}"
            fields:
              - label: "Icône"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Bouclier (auto-défense)", value: "lucide:shield" }
                  - { label: "Cœur (bien-être)", value: "lucide:heart-pulse" }
                  - { label: "Personnes (convivialité)", value: "lucide:users" }
                  - { label: "Médaille (enseignement)", value: "lucide:award" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "desc", widget: "string" }

      - name: "enseignants"
        label: "Enseignants"
        file: "src/content/config/club-teachers.json"
        format: "json"
        fields:
          - label: "Enseignants"
            name: "teachers"
            widget: "list"
            summary: "{{fields.name}} — {{fields.grade}}"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Grade", name: "grade", widget: "text" }
              - { label: "Rôle", name: "description", widget: "string" }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                allow_multiple: false
                media_folder: "/public/images/teachers"
                public_folder: "/images/teachers"
                hint: "Photo portrait de l'enseignant (rognée en format paysage dans la carte)."

      - name: "horaires"
        label: "Horaires"
        file: "src/content/config/club-schedule.json"
        format: "json"
        fields:
          - label: "Horaires"
            name: "schedule"
            widget: "list"
            summary: "{{fields.day}} {{fields.time}} — {{fields.audience}}"
            fields:
              - label: "Jour"
                name: "day"
                widget: "select"
                options:
                  - { label: "Lundi", value: "Lundi" }
                  - { label: "Mardi", value: "Mardi" }
                  - { label: "Mercredi", value: "Mercredi" }
                  - { label: "Jeudi", value: "Jeudi" }
                  - { label: "Vendredi", value: "Vendredi" }
                  - { label: "Samedi", value: "Samedi" }
                  - { label: "Dimanche", value: "Dimanche" }
              - { label: "Horaires", name: "time", widget: "string" }
              - { label: "Public concerné", name: "audience", widget: "string" }

      - name: "tarifs"
        label: "Tarifs"
        file: "src/content/config/club-prices.json"
        format: "json"
        fields:
          - label: "Tarifs"
            name: "prices"
            widget: "list"
            summary: "{{fields.category}} — {{fields.price}}€"
            fields:
              - { label: "Catégorie", name: "category", widget: "string" }
              - label: "Prix (€)"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0
              - { label: "Description", name: "description", widget: "string" }

          - label: "Adhésion"
            name: "membership"
            widget: "object"
            fields:
              - label: "Prix (€)"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0
              - { label: "Description", name: "description", widget: "string" }

  - name: "evenements"
    label: "Événements"
    description: "Compétitions et stages du club."
    files:
      - name: "evenements"
        label: "Événements"
        file: "src/content/config/events.json"
        format: "json"
        fields:
          - label: "Bannière"
            name: "header"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Sur-titre", name: "eyebrow", widget: "string" }
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }

          - label: "Événements"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} — {{fields.date}}"
            fields:
              - label: "Catégorie"
                name: "category"
                widget: "select"
                options:
                  - { label: "Compétition", value: "competition" }
                  - { label: "Stage", value: "stage" }
                  - { label: "Grades", value: "grade" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Épreuves / Catégories (compétition)", name: "categories", widget: "string" }
              - label: "Date"
                name: "date"
                widget: "datetime"
                format: "yyyy-MM-dd"
                date_format: true
                time_format: false
              - { label: "Heure / Détails", name: "time", widget: "string" }
              - { label: "Lieu", name: "location", widget: "string" }
              - { label: "Adresse", name: "address", widget: "string" }
              - { label: "Public concerné (stage)", name: "audience", widget: "string" }
              - { label: "Prix (stage)", name: "price", widget: "string" }
              - label: "Icône"
                name: "icon"
                widget: "select"
                default: "lucide:trophy"
                options:
                  - { label: "Trophée", value: "lucide:trophy" }
                  - { label: "Médaille", value: "lucide:medal" }
                  - { label: "Calendrier", value: "lucide:calendar-days" }
                  - { label: "Groupe", value: "lucide:users" }
                  - { label: "Étoile", value: "lucide:sparkles" }
                  - { label: "Cadeau", value: "lucide:gift" }
                  - { label: "Badge de validation", value: "lucide:badge-check" }

          - label: "Blocs « Pour aller plus loin »"
            name: "blocks"
            widget: "list"
            label_singular: "bloc"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "string" }
              - { label: "Détail", name: "detail", widget: "string" }
              - label: "Icône"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Trophée", value: "lucide:trophy" }
                  - { label: "Groupe", value: "lucide:users" }
                  - { label: "Bouclier", value: "lucide:shield" }
                  - { label: "Cœur", value: "lucide:heart" }
                  - { label: "Étoile", value: "lucide:sparkles" }
                  - { label: "Cadeau", value: "lucide:gift" }
                  - { label: "Badge de validation", value: "lucide:badge-check" }

  - name: "karate"
    label: "Karaté"
    description: "Contenu de la page Karaté : histoire, sensei, katas, vocabulaire et rituel."
    files:
      - name: "page"
        label: "Contenu de la page"
        file: "src/content/config/karate.json"
        format: "json"
        fields:
          - label: "Héro"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Sur-titre", name: "eyebrow", widget: "string" }
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string" }

          - label: "Histoire du Karaté"
            name: "history"
            widget: "object"
            fields:
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Texte", name: "body", widget: "richtext", hint: "Séparez vos paragraphes par une ligne vide." }

          - label: "Cartes"
            name: "cards"
            widget: "list"
            label_singular: "carte"
            summary: "{{fields.title}}"
            fields:
              - { label: "Icône", name: "icon", widget: "string" }
              - { label: "Couleur d'en-tête", name: "headerClass", widget: "string" }
              - { label: "Couleur de l'icône", name: "iconClass", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "body", widget: "richtext" }

          - label: "Sensei Taiji Kase"
            name: "senseiKase"
            widget: "object"
            fields:
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Texte", name: "body", widget: "richtext", hint: "Séparez vos paragraphes par une ligne vide." }
              - { label: "Citation", name: "quote", widget: "richtext" }
              - { label: "Auteur de la citation", name: "quoteAuthor", widget: "string" }

          - label: "Les Katas"
            name: "katas"
            widget: "object"
            fields:
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Texte", name: "body", widget: "richtext", hint: "Séparez vos paragraphes par une ligne vide." }
              - label: "Points"
                name: "points"
                widget: "list"
                label_singular: "point"
                summary: "{{fields.text}}"
                fields:
                  - { label: "Icône", name: "icon", widget: "string" }
                  - { label: "Texte", name: "text", widget: "richtext" }

          - label: "Vocabulaire technique"
            name: "vocabulary"
            widget: "object"
            fields:
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "string" }
              - label: "Catégories"
                name: "categories"
                widget: "list"
                label_singular: "catégorie"
                summary: "{{fields.title}}"
                fields:
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Icône", name: "icon", widget: "string" }
                  - label: "Termes"
                    name: "items"
                    widget: "list"
                    label_singular: "terme"
                    summary: "{{fields.term}}"
                    fields:
                      - { label: "Terme", name: "term", widget: "string" }
                      - { label: "Définition", name: "def", widget: "string" }

          - label: "Compter jusqu'à 10"
            name: "counting"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Icône", name: "icon", widget: "string" }
              - label: "Nombres"
                name: "numbers"
                widget: "list"
                label_singular: "nombre"
                summary: "{{fields.jp}} → {{fields.fr}}"
                fields:
                  - { label: "Japonais", name: "jp", widget: "string" }
                  - { label: "Français", name: "fr", widget: "string" }

          - label: "Les mots du cours"
            name: "dojoWords"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Icône", name: "icon", widget: "string" }
              - label: "Mots"
                name: "words"
                widget: "list"
                label_singular: "mot"
                summary: "{{fields.term}}"
                fields:
                  - { label: "Terme", name: "term", widget: "string" }
                  - { label: "Définition", name: "def", widget: "string" }

          - label: "Le rituel du salut"
            name: "ritual"
            widget: "object"
            fields:
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Introduction", name: "intro", widget: "richtext" }
              - label: "Étapes"
                name: "steps"
                widget: "list"
                label_singular: "étape"
                fields:
                  - { label: "Étape", name: "step", widget: "richtext" }

          - label: "Bandeau CTA"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "richtext" }
              - { label: "Bouton principal", name: "primaryLabel", widget: "string" }
              - { label: "Lien principal", name: "primaryHref", widget: "string" }
              - { label: "Bouton secondaire", name: "secondaryLabel", widget: "string" }
              - { label: "Lien secondaire", name: "secondaryHref", widget: "string" }


  - name: "karate-seniors"
    label: "Karaté Santé Seniors"
    description: "Contenu de la page Karaté Santé Seniors."
    files:
      - name: "page"
        label: "Contenu de la page"
        file: "src/content/config/karate-seniors.json"
        format: "json"
        fields:
          - label: "Héro"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Sur-titre", name: "eyebrow", widget: "string" }
              - { label: "Titre (début)", name: "titlePrefix", widget: "string" }
              - { label: "Titre (accent)", name: "titleHighlight", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - label: "Bienfaits"
            name: "benefits"
            widget: "list"
            label_singular: "bienfait"
            summary: "{{fields.title}}"
            fields:
              - { label: "Icône", name: "icon", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
          - label: "Informations pratiques"
            name: "details"
            widget: "object"
            fields:
              - { label: "Jour", name: "day", widget: "string" }
              - { label: "Horaires", name: "time", widget: "string" }
              - { label: "Essai", name: "trial", widget: "string" }
              - { label: "Lieu", name: "location", widget: "string" }
              - { label: "Adresse", name: "address", widget: "string" }
          - label: "Professeur"
            name: "teacher"
            widget: "object"
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Grade / qualification", name: "grade", widget: "string" }
          - label: "CTA"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Texte", name: "text", widget: "text" }
              - { label: "Bouton principal", name: "primaryLabel", widget: "string" }
              - { label: "Lien principal", name: "primaryHref", widget: "string" }
              - { label: "Bouton secondaire", name: "secondaryLabel", widget: "string" }
              - { label: "Lien secondaire", name: "secondaryHref", widget: "string" }
